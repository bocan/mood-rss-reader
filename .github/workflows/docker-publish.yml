name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Used as it is in the image reference, so the repository name must stay
  # lowercase.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # One build per architecture, each on a native runner (no QEMU). Each build
  # pushes its image by digest only, with no tag. The merge job joins the
  # digests into one multi-platform index and gives it the tags.
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Push the image and its attestations.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # provenance mode=max records every build-arg value in the published
      # attestation. The Dockerfile has no ARG, so nothing leaks. Keep it that
      # way: a secret goes in as a build secret (RUN --mount=type=secret), never
      # as an ARG. This check stops the build if an ARG appears.
      - name: Check the Dockerfile has no ARG
        run: |
          if grep -nE '^[[:space:]]*ARG[[:space:]]' docker/Dockerfile; then
            echo "::error file=docker/Dockerfile::ARG found. Provenance mode=max publishes its value. Use a build secret, or allow it here if it is not secret."
            exit 1
          fi

      # Attestations need the docker-container driver (or the containerd image
      # store). The classic docker driver drops them with no error. This is
      # the action's default; it is set here so that nobody changes it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels are used here. The merge job applies the tags.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # SBOM (SPDX, from BuildKit's scanner) and full SLSA provenance, both
          # attached to this platform's image as attestation manifests.
          sbom: true
          provenance: mode=max
          # One cache scope per architecture, or the two builds overwrite each
          # other's cache.
          cache-from: type=gha,scope=${{ matrix.arch }}
          # The cache's mode=max (all layers cached), not the provenance one.
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Hand the digest to the merge job: an empty file named after the digest.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      # Push the index and its signature.
      packages: write
      # Keyless cosign signing: the workflow's OIDC token gets the certificate.
      id-token: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
        env:
          # Prefix each annotation with "index:", for imagetools create below.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index

      # Join the per-platform images into one index and tag it. The
      # attestation manifests of each platform go into the index with it.
      # GHCR reads the package description from the index annotations, not
      # from the image labels, so the index gets the same metadata as
      # annotations.
      - name: Create and push the multi-platform index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          args=()
          while read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while read -r annotation; do
            args+=(--annotation "$annotation")
          done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Read the index digest
        id: index
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{ .Manifest.Digest }}')
          case "$digest" in
            sha256:*) echo "digest=$digest" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::No index digest for $IMAGE"; exit 1 ;;
          esac

      # The classic driver drops attestations with no error, and the merge
      # could lose them, so do not trust the earlier steps: read them back
      # from the registry, for each platform. This also proves that both
      # platforms are in the index.
      - name: Check the SBOM and provenance are attached
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.index.outputs.digest }}
        run: |
          for kind in SBOM Provenance; do
            out=$(docker buildx imagetools inspect "$IMAGE" --format "{{ json .$kind }}")
            for platform in linux/amd64 linux/arm64; do
              if ! jq -e --arg p "$platform" '(.[$p] // {}) | length > 0' <<< "$out" > /dev/null; then
                echo "::error::No $kind attestation for $platform on $IMAGE"
                exit 1
              fi
              echo "$kind attestation found for $platform"
            done
          done

      # Sign the digest, never a tag: a tag can move. The index digest covers
      # the image of each platform and its attestation manifests.
      - name: Sign the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Verify the signature
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.index.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Push the image, its attestations and its signature.
      packages: write
      # Keyless cosign signing: the workflow's OIDC token gets the certificate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # provenance mode=max records every build-arg value in the published
      # attestation. The Dockerfile has no ARG, so nothing leaks. Keep it that
      # way: a secret goes in as a build secret (RUN --mount=type=secret), never
      # as an ARG. This check stops the build if an ARG appears.
      - name: Check the Dockerfile has no ARG
        run: |
          if grep -nE '^[[:space:]]*ARG[[:space:]]' docker/Dockerfile; then
            echo "::error file=docker/Dockerfile::ARG found. Provenance mode=max publishes its value. Use a build secret, or allow it here if it is not secret."
            exit 1
          fi

      # Attestations need the docker-container driver (or the containerd image
      # store). The classic docker driver drops them with no error. This is
      # the action's default; it is set here so that nobody changes it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM (SPDX, from BuildKit's scanner) and full SLSA provenance, both
          # attached to the image index as attestation manifests.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          # The cache's mode=max (all layers cached), not the provenance one.
          cache-to: type=gha,mode=max

      # The classic driver drops attestations with no error, so do not trust
      # the build step: read them back from the registry.
      - name: Check the SBOM and provenance are attached
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          for kind in SBOM Provenance; do
            out=$(docker buildx imagetools inspect "$IMAGE" --format "{{ json .$kind }}")
            if [ -z "$out" ] || [ "$out" = "null" ] || [ "$out" = "{}" ]; then
              echo "::error::No $kind attestation on $IMAGE"
              exit 1
            fi
            echo "$kind attestation found"
          done

      # Sign the digest, never a tag: a tag can move. The index digest covers
      # the image and its attestation manifests.
      - name: Sign the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Verify the signature
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
